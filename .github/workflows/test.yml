name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # A rejected key must not fail the step by default
      - id: soft
        uses: ./
        with:
          key: nextmsg_live_000000000000000000000000
          status: success
      - name: Check the soft failure
        shell: bash
        run: test "${{ steps.soft.outputs.http-status }}" = "401"

      # With fail-on-error the step fails
      - id: hard
        uses: ./
        continue-on-error: true
        with:
          key: nextmsg_live_000000000000000000000000
          message: test
          fail-on-error: 'true'
      - name: Check the hard failure
        shell: bash
        run: test "${{ steps.hard.outcome }}" = "failure"
